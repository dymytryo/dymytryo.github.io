<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#F6F1E9"/>
  <!-- chart panel: survival curve -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="42" y="42" width="230" height="166" rx="8"/>
  </g>
  <!-- axes -->
  <g stroke="#D8CDBA" stroke-width="1.5">
    <line x1="66" y1="60" x2="66" y2="186"/>
    <line x1="66" y1="186" x2="254" y2="186"/>
  </g>
  <!-- 50% guide -->
  <line x1="66" y1="123" x2="254" y2="123" stroke="#D8CDBA" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- survival curve stepping down, crossing 50% at the median -->
  <path d="M66 66 L94 66 L94 78 L118 78 L118 92 L142 92 L142 106 L160 106 L160 123 L186 123 L186 138 L214 138 L214 148 L254 148"
        fill="none" stroke="#8A7B63" stroke-width="2.5"/>
  <!-- median marker -->
  <line x1="160" y1="123" x2="160" y2="186" stroke="#B4441E" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="160" cy="123" r="5" fill="#B4441E"/>
  <!-- CLV matrix: segment x channel, intensity = value -->
  <g stroke="#8A7B63" stroke-width="1.5">
    <rect x="296" y="52" width="18" height="18" rx="4" fill="#B4441E"/>
    <rect x="320" y="52" width="18" height="18" rx="4" fill="#C97B58"/>
    <rect x="344" y="52" width="18" height="18" rx="4" fill="#E9C9B4"/>
    <rect x="296" y="76" width="18" height="18" rx="4" fill="#C97B58"/>
    <rect x="320" y="76" width="18" height="18" rx="4" fill="#E9C9B4"/>
    <rect x="344" y="76" width="18" height="18" rx="4" fill="#FDF8F0"/>
    <rect x="296" y="100" width="18" height="18" rx="4" fill="#E9C9B4"/>
    <rect x="320" y="100" width="18" height="18" rx="4" fill="#FDF8F0"/>
  </g>
  <!-- the underwater cell -->
  <g stroke="#B4441E" stroke-width="1.5">
    <rect x="344" y="100" width="18" height="18" rx="4" fill="#F6F1E9"/>
    <line x1="347" y1="115" x2="359" y2="103"/>
  </g>
  <!-- lifetime dollar -->
  <g stroke="#B4441E" stroke-width="2" fill="#F6F1E9">
    <circle cx="329" cy="164" r="24"/>
  </g>
  <text x="329" y="173" font-family="ui-monospace, monospace" font-size="24" fill="#B4441E" text-anchor="middle">$</text>
  <g stroke="#8A7B63" stroke-width="1.5" stroke-linecap="round">
    <line x1="300" y1="202" x2="358" y2="202"/>
  </g>
</svg>
