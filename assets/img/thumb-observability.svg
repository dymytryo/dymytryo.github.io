<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#F6F1E9"/>
  <!-- scorecard panel -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="44" y="46" width="212" height="158" rx="8"/>
  </g>
  <line x1="44" y1="74" x2="256" y2="74" stroke="#D8CDBA" stroke-width="1.5"/>
  <!-- header dots -->
  <g fill="#D8CDBA">
    <circle cx="58" cy="60" r="4"/>
    <circle cx="72" cy="60" r="4"/>
  </g>
  <rect x="196" y="54" width="48" height="12" rx="6" fill="#F3D9CC"/>
  <!-- KPI tiles: three healthy, one alerting -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="56" y="84" width="90" height="38" rx="6"/>
    <rect x="154" y="84" width="90" height="38" rx="6"/>
    <rect x="56" y="130" width="90" height="38" rx="6"/>
  </g>
  <rect x="154" y="130" width="90" height="38" rx="6" fill="#F3D9CC" stroke="#B4441E" stroke-width="1.5"/>
  <!-- KPI bars inside tiles -->
  <g stroke="#8A7B63" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="108" x2="112" y2="108"/>
    <line x1="162" y1="108" x2="222" y2="108"/>
    <line x1="64" y1="154" x2="104" y2="154"/>
  </g>
  <line x1="162" y1="154" x2="214" y2="154" stroke="#B4441E" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#D8CDBA" stroke-width="2.5" stroke-linecap="round">
    <line x1="64" y1="97" x2="88" y2="97"/>
    <line x1="162" y1="97" x2="186" y2="97"/>
    <line x1="64" y1="143" x2="88" y2="143"/>
    <line x1="162" y1="143" x2="186" y2="143"/>
  </g>
  <!-- sparkline strip -->
  <polyline points="56,192 76,188 96,190 116,184 136,187 156,182 176,186 196,178 216,183 244,176"
            fill="none" stroke="#8A7B63" stroke-width="2"/>
  <!-- alert bell -->
  <g stroke="#B4441E" stroke-width="2" fill="#F6F1E9">
    <circle cx="316" cy="92" r="22"/>
  </g>
  <g fill="#B4441E">
    <path d="M316 80 c-7 0 -9 6 -9 12 v5 l-3 5 h24 l-3 -5 v-5 c0 -6 -2 -12 -9 -12 z"/>
    <circle cx="316" cy="105" r="2.6"/>
  </g>
  <!-- ping arcs -->
  <g fill="none" stroke="#B4441E" stroke-width="2" stroke-linecap="round">
    <path d="M344 76 a26 26 0 0 1 6 16"/>
    <path d="M288 76 a26 26 0 0 0 -6 16"/>
  </g>
  <!-- connector: failing tile -> bell -->
  <path d="M248 149 C 280 149 296 136 306 118" fill="none" stroke="#B4441E" stroke-width="2.5"/>
  <path d="M301 122 L 308 112 L 311 124 Z" fill="#B4441E"/>
  <!-- status dots: delivery states -->
  <g>
    <circle cx="296" cy="160" r="7" fill="#FFFFFF" stroke="#8A7B63" stroke-width="1.5"/>
    <circle cx="320" cy="160" r="7" fill="#F3D9CC" stroke="#8A7B63" stroke-width="1.5"/>
    <circle cx="344" cy="160" r="7" fill="#B4441E"/>
  </g>
  <g stroke="#8A7B63" stroke-width="1.5" stroke-linecap="round">
    <line x1="290" y1="182" x2="350" y2="182"/>
    <line x1="298" y1="192" x2="342" y2="192"/>
  </g>
</svg>
