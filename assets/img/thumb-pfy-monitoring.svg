<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#F6F1E9"/>
  <!-- left: six source chips converging -->
  <g fill="#FFFFFF" stroke="#8A7B63" stroke-width="1.5">
    <rect x="40" y="52" width="20" height="20" rx="4"/>
    <rect x="40" y="82" width="20" height="20" rx="4"/>
    <rect x="40" y="112" width="20" height="20" rx="4"/>
    <rect x="40" y="142" width="20" height="20" rx="4"/>
    <rect x="40" y="172" width="20" height="20" rx="4"/>
    <rect x="40" y="202" width="20" height="20" rx="4"/>
  </g>
  <!-- convergence into the platform -->
  <g stroke="#8A7B63" stroke-width="1.5" fill="none">
    <path d="M64 62 C 110 62 110 125 148 125"/>
    <path d="M64 92 C 108 92 108 125 148 125"/>
    <path d="M64 122 L 148 125"/>
    <path d="M64 152 C 108 152 108 125 148 125"/>
    <path d="M64 182 C 110 182 110 125 148 125"/>
    <path d="M64 212 C 112 212 112 125 148 125"/>
  </g>
  <!-- platform node -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="150" y="96" width="96" height="58" rx="10"/>
  </g>
  <g fill="#B4441E">
    <circle cx="176" cy="118" r="6"/>
    <rect x="192" y="112" width="34" height="5" rx="2"/>
    <rect x="192" y="122" width="26" height="5" rx="2" fill="#8A7B63"/>
  </g>
  <rect x="168" y="134" width="60" height="6" rx="3" fill="#D8CDBA"/>
  <!-- arrow to the scorecard -->
  <g stroke="#B4441E" stroke-width="2.2" fill="none">
    <path d="M250 125 h30"/>
  </g>
  <path d="M278 118 L 292 125 L 278 132 Z" fill="#B4441E"/>
  <!-- scorecard panel with the no-call flag -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="298" y="70" width="72" height="110" rx="10"/>
  </g>
  <g stroke="#8A7B63" stroke-width="1.4">
    <line x1="312" y1="92" x2="356" y2="92"/>
    <line x1="312" y1="114" x2="356" y2="114"/>
    <line x1="312" y1="158" x2="356" y2="158"/>
  </g>
  <!-- green good rows -->
  <circle cx="318" cy="86" r="4" fill="#6F8F6A"/>
  <circle cx="318" cy="108" r="4" fill="#6F8F6A"/>
  <!-- the flagged outlier row -->
  <rect x="304" y="126" width="60" height="24" rx="5" fill="#F3D9CC" stroke="#B4441E" stroke-width="1.5"/>
  <path d="M311 138 l4 4 l7 -8" fill="none" stroke="#B4441E" stroke-width="2" stroke-linecap="round"/>
  <rect x="326" y="135" width="30" height="6" rx="3" fill="#B4441E"/>
  <!-- phone-with-slash: the no-call motif -->
  <g stroke="#B4441E" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M312 168 q4 6 12 8"/>
    <line x1="310" y1="164" x2="330" y2="180"/>
  </g>
</svg>
