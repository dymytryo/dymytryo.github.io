<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#F6F1E9"/>
  <!-- chart panel -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="42" y="42" width="230" height="166" rx="8"/>
  </g>
  <g stroke="#D8CDBA" stroke-width="1.5">
    <line x1="66" y1="60" x2="66" y2="186"/>
    <line x1="66" y1="186" x2="254" y2="186"/>
  </g>
  <!-- rising cost bars then the cliff -->
  <g fill="#D8CDBA" stroke="#8A7B63" stroke-width="1.2">
    <rect x="76" y="158" width="18" height="28" rx="3"/>
    <rect x="100" y="140" width="18" height="46" rx="3"/>
    <rect x="124" y="122" width="18" height="64" rx="3"/>
    <rect x="148" y="104" width="18" height="82" rx="3"/>
    <rect x="172" y="80" width="18" height="106" rx="3"/>
  </g>
  <g fill="#B4441E">
    <rect x="196" y="150" width="18" height="36" rx="3"/>
    <rect x="220" y="170" width="18" height="16" rx="3"/>
  </g>
  <!-- cliff arrow -->
  <path d="M186 84 q26 10 34 58" fill="none" stroke="#B4441E" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M216 136 L 222 148 L 210 146 Z" fill="#B4441E"/>
  <!-- iceberg with waste below waterline -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="290" y="52" width="76" height="146" rx="10"/>
  </g>
  <line x1="298" y1="110" x2="358" y2="110" stroke="#8A7B63" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M312 110 L 328 78 L 344 110 Z" fill="#F3D9CC" stroke="#B4441E" stroke-width="1.6"/>
  <path d="M304 110 L 328 172 L 352 110 Z" fill="#FDF8F0" stroke="#8A7B63" stroke-width="1.5"/>
  <!-- broom sweeping the berg's excess -->
  <g stroke="#B4441E" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M310 150 L 346 132"/>
    <path d="M306 158 l6 -4 M310 162 l8 -6 M316 166 l8 -7"/>
  </g>
</svg>
