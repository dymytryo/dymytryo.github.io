<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect width="400" height="250" fill="#F6F1E9"/>
  <!-- container stack: two images -->
  <g stroke="#8A7B63" stroke-width="1.5">
    <rect x="52" y="140" width="34" height="26" rx="5" fill="#FFFFFF"/>
    <rect x="90" y="140" width="34" height="26" rx="5" fill="#FFFFFF"/>
    <rect x="128" y="140" width="34" height="26" rx="5" fill="#FFFFFF"/>
    <rect x="71" y="110" width="34" height="26" rx="5" fill="#F3D9CC"/>
    <rect x="109" y="110" width="34" height="26" rx="5" fill="#FFFFFF"/>
  </g>
  <!-- deck line under containers -->
  <line x1="44" y1="172" x2="170" y2="172" stroke="#8A7B63" stroke-width="2" stroke-linecap="round"/>
  <!-- DAG panel -->
  <g fill="#FFFFFF" stroke="#D8CDBA" stroke-width="1.5">
    <rect x="212" y="58" width="146" height="134" rx="10"/>
  </g>
  <!-- DAG nodes -->
  <g stroke="#8A7B63" stroke-width="1.5">
    <circle cx="240" cy="92" r="9" fill="#FFFFFF"/>
    <circle cx="284" cy="92" r="9" fill="#FFFFFF"/>
    <circle cx="284" cy="130" r="9" fill="#FFFFFF"/>
    <circle cx="328" cy="112" r="9" fill="#B4441E" stroke="#B4441E"/>
    <circle cx="328" cy="160" r="9" fill="#FFFFFF"/>
  </g>
  <!-- DAG edges -->
  <g stroke="#B4441E" stroke-width="1.8" fill="none">
    <path d="M249 92 h26"/>
    <path d="M291 98 L 321 108"/>
    <path d="M291 124 L 321 114"/>
    <path d="M284 101 v20"/>
    <path d="M328 121 v30"/>
  </g>
  <!-- factory arrow from containers to DAG -->
  <g stroke="#8A7B63" stroke-width="1.8" fill="none">
    <path d="M176 125 h24"/>
  </g>
  <path d="M198 120 L 208 125 L 198 130 Z" fill="#8A7B63"/>
  <!-- gear: shared policy -->
  <g stroke="#B4441E" stroke-width="2" fill="#F6F1E9">
    <circle cx="88" cy="66" r="17"/>
  </g>
  <g stroke="#B4441E" stroke-width="2">
    <line x1="88" y1="43" x2="88" y2="51"/>
    <line x1="88" y1="81" x2="88" y2="89"/>
    <line x1="65" y1="66" x2="73" y2="66"/>
    <line x1="103" y1="66" x2="111" y2="66"/>
    <line x1="72" y1="50" x2="78" y2="56"/>
    <line x1="98" y1="76" x2="104" y2="82"/>
    <line x1="104" y1="50" x2="98" y2="56"/>
    <line x1="78" y1="76" x2="72" y2="82"/>
  </g>
  <circle cx="88" cy="66" r="5" fill="#B4441E"/>
</svg>
